name: TVXO Release

# Active copy: .github/workflows/tvxo-release.yml (ci/tvxo-release.yml is kept identical).
# Needs the Actions secrets listed below; see TVXO_BUILD_GUIDE.md.

# Builds a signed TVXO release APK and publishes it to this repository's GitHub Releases,
# where the in-app updater looks for it (owner/repo is set by `tvxo.updateRepo` in
# gradle.properties, default tousantjr/TVXO).
#
# Run it from the Actions tab (Run workflow). The version number is picked automatically
# from versionName in app/build.gradle.kts plus a build counter:
#   versionName 1.1.0-beta.13  ->  1.1.0-beta.13.1, 1.1.0-beta.13.2, ...
#   versionName 1.2.0          ->  1.2.1-tvxo.1, 1.2.1-tvxo.2, ...
#
# Release assets (the updater picks the one matching the TV's CPU, e.g. arm64-v8a):
#   TVXO-<version>-arm64-v8a-release.apk
#   TVXO-<version>-armeabi-v7a-release.apk
#   TVXO-<version>-universal-release.apk
#
# Required repository secrets:
#   TVXO_KEYSTORE_BASE64     base64 of your release .jks file
#   TVXO_KEYSTORE_PASSWORD   keystore password
#   TVXO_KEY_ALIAS           key alias
#   TVXO_KEY_PASSWORD        key password
# Optional secrets (features stay off when missing): TMDB_API_KEY, TVDB_API_KEY, TRAKT_CLIENT_ID,
#   TRAKT_CLIENT_SECRET, SIMKL_CLIENT_ID, SIMKL_APP_NAME, MDBLIST_CLIENT_ID,
#   GOOGLE_DRIVE_CLIENT_ID, GOOGLE_DRIVE_CLIENT_SECRET, PREMIUMIZE_CLIENT_ID,
#   INTRODB_API_URL, TVXO_PRIVACY_POLICY_URL
on:
  workflow_dispatch:
    inputs:
      notes:
        description: "What changed (shown in the update prompt)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check signing secrets
        env:
          KS: ${{ secrets.TVXO_KEYSTORE_BASE64 }}
          KSP: ${{ secrets.TVXO_KEYSTORE_PASSWORD }}
          KA: ${{ secrets.TVXO_KEY_ALIAS }}
          KP: ${{ secrets.TVXO_KEY_PASSWORD }}
        run: |
          missing=""
          [ -z "$KS" ] && missing="$missing TVXO_KEYSTORE_BASE64"
          [ -z "$KSP" ] && missing="$missing TVXO_KEYSTORE_PASSWORD"
          [ -z "$KA" ] && missing="$missing TVXO_KEY_ALIAS"
          [ -z "$KP" ] && missing="$missing TVXO_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing (Settings > Secrets and variables > Actions)"
            exit 1
          fi

      - name: Work out the version number
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BASE=$(grep -m1 -E '^\s*versionName = "' app/build.gradle.kts | sed -E 's/.*"(.*)".*/\1/')
          if [ -z "$BASE" ]; then echo "Couldn't read versionName from app/build.gradle.kts" >&2; exit 1; fi
          if [[ "$BASE" == *-* ]]; then
            PREFIX="$BASE."
          else
            IFS=. read -r MA MI PA <<< "$BASE"
            PREFIX="$MA.$MI.$((PA + 1))-tvxo."
          fi
          LAST=$(gh release list -R "$GITHUB_REPOSITORY" --limit 200 --json tagName -q '.[].tagName' \
            | grep -F "$PREFIX" | sed "s/^$(printf '%s' "$PREFIX" | sed 's/[.[\*^$/]/\\&/g')//" \
            | grep -E '^[0-9]+$' | sort -n | tail -1 || true)
          N=$(( ${LAST:-0} + 1 ))
          if [ "$N" -gt 99 ]; then echo "Too many builds on one base version (max 99). Raise versionName in app/build.gradle.kts." >&2; exit 1; fi
          VERSION="$PREFIX$N"
          echo "Base $BASE -> TVXO release $VERSION (build $N)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "number=$N" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
          cache-dependency-path: vpn-android/native/go.sum

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Write optional app keys
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TVDB_API_KEY: ${{ secrets.TVDB_API_KEY }}
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
          SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
          SIMKL_APP_NAME: ${{ secrets.SIMKL_APP_NAME }}
          MDBLIST_CLIENT_ID: ${{ secrets.MDBLIST_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          PREMIUMIZE_CLIENT_ID: ${{ secrets.PREMIUMIZE_CLIENT_ID }}
          INTRODB_API_URL: ${{ secrets.INTRODB_API_URL }}
          TVXO_PRIVACY_POLICY_URL: ${{ secrets.TVXO_PRIVACY_POLICY_URL }}
        run: |
          : > keys.properties
          add() { if [ -n "$2" ]; then echo "$1=$2" >> keys.properties; fi; }
          add TMDB_API_KEY "$TMDB_API_KEY"
          add TVDB_API_KEY "$TVDB_API_KEY"
          add TRAKT_CLIENT_ID "$TRAKT_CLIENT_ID"
          add TRAKT_CLIENT_SECRET "$TRAKT_CLIENT_SECRET"
          add SIMKL_CLIENT_ID "$SIMKL_CLIENT_ID"
          add SIMKL_APP_NAME "$SIMKL_APP_NAME"
          add MDBLIST_CLIENT_ID "$MDBLIST_CLIENT_ID"
          add GOOGLE_DRIVE_CLIENT_ID "$GOOGLE_DRIVE_CLIENT_ID"
          add GOOGLE_DRIVE_CLIENT_SECRET "$GOOGLE_DRIVE_CLIENT_SECRET"
          add PREMIUMIZE_CLIENT_ID "$PREMIUMIZE_CLIENT_ID"
          add INTRODB_API_URL "${INTRODB_API_URL:-https://api.introdb.app/}"
          add TVXO_PRIVACY_POLICY_URL "$TVXO_PRIVACY_POLICY_URL"
          # The build reads some values from each file, so write both.
          cp keys.properties local.properties
          cp keys.properties local.dev.properties
          rm keys.properties
          echo "Keys set:"; cut -d= -f1 local.properties

      - name: Signing
        env:
          KS: ${{ secrets.TVXO_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KS" | base64 -d > "$RUNNER_TEMP/tvxo-release.jks"
          echo "TVXO_KEYSTORE_FILE=$RUNNER_TEMP/tvxo-release.jks" >> "$GITHUB_ENV"

      - name: Build APK
        env:
          TVXO_KEYSTORE_PASSWORD: ${{ secrets.TVXO_KEYSTORE_PASSWORD }}
          TVXO_KEY_ALIAS: ${{ secrets.TVXO_KEY_ALIAS }}
          TVXO_KEY_PASSWORD: ${{ secrets.TVXO_KEY_PASSWORD }}
          TVXO_UPDATE_REPO: ${{ github.repository }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleFullRelease --stacktrace \
            -PlivetvBuildNumber=${{ steps.version.outputs.number }} \
            -PlivetvVersionName=${{ steps.version.outputs.version }}

      - name: Verify signature and collect APKs
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p out
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          for f in $(find app/build/outputs/apk/full/release -name "*.apk"); do
            "$APKSIGNER" verify --print-certs "$f" | head -3
            name=$(basename "$f" .apk)
            cp "$f" "out/TVXO-$VERSION-${name#app-full-}.apk"
          done
          ls -la out
          ls out/*arm64-v8a*.apk >/dev/null || { echo "::error::No arm64-v8a APK was built"; exit 1; }

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: TVXO ${{ steps.version.outputs.version }}
          prerelease: true
          files: out/*.apk
          body: |
            TVXO update ${{ steps.version.outputs.version }}.

            ${{ inputs.notes }}

            TVXO is a modified version of NuvioPlusIPTV and Nuvio, licensed under GPL-3.0.
            Source code: ${{ github.server_url }}/${{ github.repository }}

      # One fixed link that always gives the newest APK (useful for a Downloader code):
      # https://github.com/<owner>/<repo>/releases/download/downloader/TVXO.apk
      # The "downloader" tag is not a version number, so the in-app updater ignores it.
      - name: Update the fixed "newest APK" link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Universal first: Sony Bravia and many Google TVs run 32-bit (armeabi-v7a) userspace,
          # so an arm64-only APK shows "This app isn't compatible with your TV."
          APK=$(ls out/*universal*.apk 2>/dev/null | head -1)
          [ -z "$APK" ] && APK=$(ls out/*armeabi-v7a*.apk 2>/dev/null | head -1)
          [ -z "$APK" ] && APK=$(ls out/*arm64-v8a*.apk 2>/dev/null | head -1)
          if [ -z "$APK" ]; then echo "::error::No universal, armeabi-v7a or arm64-v8a APK found in out/ for the Downloader link"; exit 1; fi
          echo "Downloader link will serve: $APK"
          mkdir -p dl
          cp "$APK" dl/TVXO.apk
          if ! gh release view downloader -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create downloader -R "$GITHUB_REPOSITORY" \
              --title "TVXO (always the newest version)" \
              --notes "This file is replaced with the newest TVXO build every release. Updates after installing happen inside the app." \
              --latest=false --prerelease
          fi
          gh release upload downloader dl/TVXO.apk -R "$GITHUB_REPOSITORY" --clobber
